#  Debian packages installed on top of the distroless base image.
#
#  Anytime this file is changed, the lockfile needs to be regenerated.
#
#  To generate the bookworm.lock.json run the following command
#
#     bazel run @bookworm//:lock
version: 1
# The same Debian snapshot as the C++ toolchain's sysroot
# (toolchains/sysroot/MODULE.bazel).
sources:
  - channel: bookworm main
    urls:
      - https://snapshot-cloudflare.debian.org/archive/debian/20260815T000000Z
      - https://snapshot.debian.org/archive/debian/20260815T000000Z
  - channel: bookworm-security main
    urls:
      - https://snapshot-cloudflare.debian.org/archive/debian-security/20260815T000000Z
      - https://snapshot.debian.org/archive/debian-security/20260815T000000Z
archs:
  - "amd64"
packages:
  # The manylinux wheels of numpy, scipy and pillow link libz.so.1.
  - "zlib1g"
