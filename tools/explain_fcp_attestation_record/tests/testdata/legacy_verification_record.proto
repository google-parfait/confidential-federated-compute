syntax = "proto3";

package fcp.confidentialcompute;

import "fcp/protos/confidentialcompute/access_policy.proto";
import "proto/attestation/evidence.proto";

// Test-only schema mirroring the pre-SignedPayload AttestationVerificationRecord
// schema (used at commit f5e8cfc6d3e20f3dcfe63ff8f8f11647ca2fd0f9).
message LegacyAttestationVerificationRecord {
  oak.attestation.v1.Evidence attestation_evidence = 1;
  bytes attestation_endorsements = 2;
  fcp.confidentialcompute.DataAccessPolicy data_access_policy = 3;
}
